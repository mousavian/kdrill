<style>
:root{--kraft:#C8A27A;--ink:#1D2A5B;--orange:#FF5A1F;--plastic:#2E3238;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:48px 16px;background-color:var(--kraft);background-image:repeating-linear-gradient(90deg,rgba(74,46,18,.05) 0 2px,rgba(255,236,205,.04) 2px 5px,rgba(0,0,0,0) 5px 10px);color:var(--ink);font:400 17px/1.55 'Archivo',system-ui,sans-serif}
main{max-width:620px}
h1{margin:0 0 .25em;font:900 clamp(56px,13vw,120px)/.85 'Big Shoulders Stencil Display',Impact,sans-serif;text-transform:uppercase}
p{margin:0 0 24px;max-width:32em}
code{font:400 .86em 'Martian Mono',ui-monospace,Menlo,monospace;font-stretch:87.5%}
.slot{display:block;width:100%;max-width:420px;height:auto;margin:0 0 28px}
a.btn{display:inline-flex;align-items:center;min-height:52px;padding:12px 22px;border:3px solid var(--ink);border-radius:6px;background:var(--orange);color:var(--ink);font:800 19px/1.1 'Archivo',sans-serif;font-stretch:112%;text-decoration:none}
a.btn:hover{box-shadow:4px 4px 0 var(--ink);transform:translate(-2px,-2px)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
 <svg class="slot" viewBox="0 0 420 70" role="img" aria-label="An empty moulded slot in a dark bit case">
  <rect x="2" y="2" width="416" height="66" rx="18" fill="#2E3238" stroke="#1D2A5B" stroke-width="3"/>
  <rect x="18" y="20" width="384" height="30" rx="15" fill="#1D1F23" stroke="#5A6069" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="38" y="40" fill="#B4B9C0" font-family="Archivo,sans-serif" font-weight="700" font-size="14">404: not in this box</text>
 </svg>
 <h1>Bit not found</h1>
 <p>This page fell out of the case. <code>kdrill reset</code> won't bring it back, but the home page still has all 141 bits.</p>
 <a class="btn" href="/">Back to the box</a>
</main>
</body>
</html>
