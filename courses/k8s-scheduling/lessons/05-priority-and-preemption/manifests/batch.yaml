apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
spec:
  replicas: 4
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: batch}
  template:
    metadata:
      labels: {app: batch}
    spec:
      containers:
      - name: batch
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: "2"
            memory: 1Gi
