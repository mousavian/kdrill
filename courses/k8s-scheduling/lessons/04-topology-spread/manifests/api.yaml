apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 6
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      # Added by a colleague "to keep latency low". It also means one zone
      # outage takes the whole API down.
      nodeSelector:
        topology.kubernetes.io/zone: a
      containers:
      - name: api
        image: nginx:1.27
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
