apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: trainer}
  template:
    metadata:
      labels: {app: trainer}
    spec:
      containers:
      - name: trainer
        image: nginx:1.27
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
