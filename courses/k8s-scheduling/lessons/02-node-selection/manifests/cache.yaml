apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: cache}
  template:
    metadata:
      labels: {app: cache}
    spec:
      containers:
      - name: cache
        image: nginx:1.27
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
