apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: shop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner
  namespace: shop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: shop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      serviceAccountName: web
      terminationGracePeriodSeconds: 1
      containers:
      - name: curl
        image: curlimages/curl:8.23.0
        command: [sleep, infinity]
        resources:
          requests: {cpu: 5m, memory: 8Mi}
          limits: {memory: 32Mi}
---
# A vulnerability scanner: must not reach payments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: scanner}
  template:
    metadata:
      labels: {app: scanner}
    spec:
      serviceAccountName: scanner
      terminationGracePeriodSeconds: 1
      containers:
      - name: curl
        image: curlimages/curl:8.23.0
        command: [sleep, infinity]
        resources:
          requests: {cpu: 5m, memory: 8Mi}
          limits: {memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-v1
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog, version: v1}
  template:
    metadata:
      labels: {app: catalog, version: v1}
    spec:
      serviceAccountName: catalog
      terminationGracePeriodSeconds: 2
      containers:
      - name: catalog
        image: mccutchen/go-httpbin:2.26.0
        env: [{name: USE_REAL_HOSTNAME, value: "true"}]
        ports: [{containerPort: 8080, name: http}]
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-v2
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog, version: v2}
  template:
    metadata:
      labels: {app: catalog, version: v2}
    spec:
      serviceAccountName: catalog
      terminationGracePeriodSeconds: 2
      containers:
      - name: catalog
        image: mccutchen/go-httpbin:2.26.0
        env: [{name: USE_REAL_HOSTNAME, value: "true"}]
        ports: [{containerPort: 8080, name: http}]
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: payments}
  template:
    metadata:
      labels: {app: payments}
    spec:
      serviceAccountName: payments
      terminationGracePeriodSeconds: 2
      containers:
      - name: payments
        image: mccutchen/go-httpbin:2.26.0
        env: [{name: USE_REAL_HOSTNAME, value: "true"}]
        ports: [{containerPort: 8080, name: http}]
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {memory: 64Mi}
