apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalog
  namespace: shop
spec:
  hosts: [catalog]
  http:
  - name: beta
    match:
    - headers:
        x-beta:
          exact: "true"
    route:
    - destination: {host: catalog, subset: v2}
  - name: default
    route:
    - destination: {host: catalog, subset: v1}
