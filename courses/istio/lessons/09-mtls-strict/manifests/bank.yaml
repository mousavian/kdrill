apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger
  namespace: bank
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: bank
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledger}
  template:
    metadata:
      labels: {app: ledger}
    spec:
      serviceAccountName: ledger
      terminationGracePeriodSeconds: 2
      containers:
      - name: ledger
        image: mccutchen/go-httpbin:2.26.0
        env: [{name: USE_REAL_HOSTNAME, value: "true"}]
        ports: [{containerPort: 8080, name: http}]
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {memory: 64Mi}
      - name: metrics            # stands in for a metrics endpoint scraped by the old monitoring system
        image: mccutchen/go-httpbin:2.26.0
        env: [{name: PORT, value: "9090"}]
        ports: [{containerPort: 9090, name: http-metrics}]
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: bank
spec:
  selector: {app: ledger}
  ports:
  - {name: http, port: 8000, targetPort: 8080}
  - {name: http-metrics, port: 9090, targetPort: 9090}
