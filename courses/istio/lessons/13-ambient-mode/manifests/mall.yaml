apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: mall
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bot
  namespace: mall
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: mall
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mall
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      serviceAccountName: web
      terminationGracePeriodSeconds: 1
      containers:
      - name: curl
        image: curlimages/curl:8.23.0
        command: [sleep, infinity]
        resources:
          requests: {cpu: 5m, memory: 8Mi}
          limits: {memory: 32Mi}
---
# A scraper bot that must not reach the api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: mall
spec:
  replicas: 1
  selector:
    matchLabels: {app: bot}
  template:
    metadata:
      labels: {app: bot}
    spec:
      serviceAccountName: bot
      terminationGracePeriodSeconds: 1
      containers:
      - name: curl
        image: curlimages/curl:8.23.0
        command: [sleep, infinity]
        resources:
          requests: {cpu: 5m, memory: 8Mi}
          limits: {memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mall
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      serviceAccountName: api
      terminationGracePeriodSeconds: 2
      containers:
      - name: api
        image: mccutchen/go-httpbin:2.26.0
        env: [{name: USE_REAL_HOSTNAME, value: "true"}]
        ports: [{containerPort: 8080, name: http}]
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mall
spec:
  selector: {app: api}
  ports:
  - {name: http, port: 8000, targetPort: 8080}
