apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ratings
  namespace: shop
spec:
  hosts: [ratings]
  http:
  - name: chaos-abort
    match:
    - headers: {x-chaos: {exact: abort}}
    fault:
      abort:
        httpStatus: 503
        percentage: {value: 100}
    route:
    - destination: {host: ratings}
  - name: chaos-delay
    match:
    - headers: {x-chaos: {exact: delay}}
    fault:
      delay:
        fixedDelay: 2s
        percentage: {value: 100}
    route:
    - destination: {host: ratings}
  - name: chaos-flaky
    match:
    - headers: {x-chaos: {exact: flaky}}
    fault:
      abort:
        httpStatus: 500
        percentage: {value: 50}
    route:
    - destination: {host: ratings}
  - name: main
    route:
    - destination: {host: ratings}
