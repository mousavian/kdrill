apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: shop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      serviceAccountName: web
      terminationGracePeriodSeconds: 1
      containers:
      - name: curl
        image: curlimages/curl:8.23.0
        command: [sleep, infinity]
        resources:
          requests: {cpu: 5m, memory: 8Mi}
          limits: {memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      serviceAccountName: catalog
      terminationGracePeriodSeconds: 2
      containers:
      - name: catalog
        image: mccutchen/go-httpbin:2.26.0
        env: [{name: USE_REAL_HOSTNAME, value: "true"}]
        ports: [{containerPort: 8080, name: http}]
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: shop
spec:
  selector: {app: catalog}
  ports:
  - {name: http, port: 8000, targetPort: 8080}
