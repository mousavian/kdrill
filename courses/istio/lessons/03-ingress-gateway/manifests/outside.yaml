apiVersion: v1
kind: ServiceAccount
metadata:
  name: visitor
  namespace: outside
---
# Stands in for a user on the internet: no sidecar, calls the ingress gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visitor
  namespace: outside
spec:
  replicas: 1
  selector:
    matchLabels: {app: visitor}
  template:
    metadata:
      labels: {app: visitor}
    spec:
      serviceAccountName: visitor
      terminationGracePeriodSeconds: 1
      containers:
      - name: curl
        image: curlimages/curl:8.23.0
        command: [sleep, infinity]
        resources:
          requests: {cpu: 5m, memory: 8Mi}
          limits: {memory: 32Mi}
