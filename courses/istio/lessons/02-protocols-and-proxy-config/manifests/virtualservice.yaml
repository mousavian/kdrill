# The platform team's routing for catalog: tag every response so the
# frontend team can see the request went through the mesh.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalog
  namespace: store
spec:
  hosts: [catalog]
  http:
  - headers:
      response:
        set:
          x-route: catalog-mesh
    route:
    - destination:
        host: catalog
        port: {number: 8000}
