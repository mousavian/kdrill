apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
  - name: https-shop
    protocol: HTTPS
    port: 443
    hostname: shop.lab                 # SNI and Host must match
    tls:
      mode: Terminate
      certificateRefs:
      - {kind: Secret, name: shop-tls}
  - name: https-api
    protocol: HTTPS
    port: 443
    hostname: api.lab
    tls:
      mode: Terminate
      certificateRefs:
      - {kind: Secret, name: api-tls}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs: [{name: edge, sectionName: https-shop}]
  hostnames: ["shop.lab"]
  rules:
  - backendRefs: [{name: shop, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs: [{name: edge, sectionName: https-api}]
  hostnames: ["api.lab"]
  rules:
  - backendRefs: [{name: api, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: to-https
spec:
  parentRefs: [{name: edge, sectionName: http}]   # only the plain listener
  hostnames: ["shop.lab", "api.lab"]
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect: {scheme: https, statusCode: 301}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: edge-clients
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: edge
  tls:
    minVersion: "1.3"
