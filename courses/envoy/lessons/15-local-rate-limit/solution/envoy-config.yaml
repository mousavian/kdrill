apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: main
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: all
                  domains: ["*"]
                  routes:
                  - match: {path: "/health"}
                    route: {cluster: api}
                  - match: {prefix: "/api/"}
                    route: {cluster: api}
                    typed_per_filter_config:           # the bucket for this route
                      envoy.filters.http.local_ratelimit:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                        stat_prefix: api
                        token_bucket:
                          max_tokens: 5
                          tokens_per_fill: 5
                          fill_interval: 10s
                        filter_enabled:
                          runtime_key: api_ratelimit_enabled
                          default_value: {numerator: 100, denominator: HUNDRED}
                        filter_enforced:
                          runtime_key: api_ratelimit_enforced
                          default_value: {numerator: 100, denominator: HUNDRED}
                        response_headers_to_add:
                        - header: {key: x-local-rate-limit, value: "true"}
              http_filters:
              - name: envoy.filters.http.local_ratelimit   # in the chain, but no bucket by default
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                  stat_prefix: http_local_rate_limiter
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: api
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: api
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: api, port_value: 80}}}
