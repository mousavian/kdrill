apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: main
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: all
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/public/"}
                    route: {cluster: shop}
                  - match: {prefix: "/api/"}
                    route: {cluster: shop}
              http_filters:
              - name: envoy.filters.http.jwt_authn
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                  providers:
                    lab:
                      issuer: https://auth.lab
                      audiences: [shop]
                      local_jwks:
                        filename: /certs/jwks.json
                      claim_to_headers:
                      - {header_name: x-user, claim_name: sub}
                      payload_in_metadata: jwt_payload   # claims -> dynamic metadata for RBAC
                  rules:
                  - match: {prefix: "/public/"}      # no requirement: no check
                  - match: {prefix: "/api/"}
                    requires: {provider_name: lab}
              - name: envoy.filters.http.rbac
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                  rules:
                    action: ALLOW                    # deny unless a policy allows
                    policies:
                      public:
                        permissions: [{url_path: {path: {prefix: "/public/"}}}]
                        principals: [{any: true}]
                      read-only:
                        permissions:
                        - and_rules:
                            rules:
                            - or_rules:
                                rules:
                                - header: {name: ":method", string_match: {exact: GET}}
                                - header: {name: ":method", string_match: {exact: HEAD}}
                            - not_rule: {url_path: {path: {prefix: "/api/admin/"}}}
                        principals:                  # any verified token
                        - metadata:
                            filter: envoy.filters.http.jwt_authn
                            path: [{key: jwt_payload}, {key: sub}]
                            value: {present_match: true}
                      admin:
                        permissions: [{any: true}]
                        principals:
                        - metadata:
                            filter: envoy.filters.http.jwt_authn
                            path: [{key: jwt_payload}, {key: role}]
                            value: {string_match: {exact: admin}}
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: shop
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: shop
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: shop, port_value: 80}}}
