apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs: [{name: edge}]
  hostnames: ["www.lab", "*.lab"]     # exact hostnames of other routes win over the wildcard
  rules:
  - backendRefs: [{name: web, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs: [{name: edge}]
  hostnames: ["api.lab"]
  rules:
  # The order of rules doesn't matter: Envoy Gateway sorts the matches by
  # Gateway API precedence (path, then method, then headers, then query params).
  - backendRefs: [{name: api-v1, port: 80}]          # no matches = PathPrefix /
  - matches:
    - path: {type: PathPrefix, value: /v2}           # /v2 and /v2/..., not /v2beta
    - headers:
      - {name: x-api-version, value: "2"}
    - queryParams:
      - {name: canary, value: "true"}
    backendRefs: [{name: api-v2, port: 80}]
  - matches:
    - path: {type: Exact, value: /orders}
      method: POST
    backendRefs: [{name: orders, port: 80}]
