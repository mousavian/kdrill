apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: main
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: all
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/api/"}
                    route:
                      cluster: api
                      timeout: 1s          # whole request, until the response is complete
                  - match: {prefix: "/reports/"}
                    route:
                      cluster: reports
                      timeout: 10s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: api
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: api
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: api, port_value: 80}}}
      - name: reports
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: reports
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: reports, port_value: 80}}}
