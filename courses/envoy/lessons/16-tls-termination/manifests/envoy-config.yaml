apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: http
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: http
              route_config:
                name: plain
                virtual_hosts:
                - name: shop
                  domains: ["shop.lab"]
                  routes:
                  - match: {prefix: "/"}
                    route: {cluster: shop}
                - name: api
                  domains: ["api.lab"]
                  routes:
                  - match: {prefix: "/"}
                    route: {cluster: api}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      # TODO: an HTTPS listener on 10443. The certificates are in /certs:
      #   shop.crt shop.key (CN/SAN shop.lab), api.crt api.key (CN/SAN api.lab)
      clusters:
      - name: shop
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: shop
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: shop, port_value: 80}}}
      - name: api
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: api
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: api, port_value: 80}}}
