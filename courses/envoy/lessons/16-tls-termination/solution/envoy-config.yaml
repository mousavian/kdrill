apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: http                       # plain HTTP: only redirects now
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: http
              route_config:
                name: plain
                virtual_hosts:
                - name: redirect
                  domains: ["shop.lab", "api.lab"]
                  routes:
                  - match: {prefix: "/"}
                    redirect: {https_redirect: true}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      - name: https
        address:
          socket_address: {address: 0.0.0.0, port_value: 10443}
        listener_filters:
        - name: envoy.filters.listener.tls_inspector      # reads SNI/ALPN from the ClientHello
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
        filter_chains:
        - filter_chain_match: {server_names: ["shop.lab"]}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols: [h2, http/1.1]
                tls_certificates:
                - certificate_chain: {filename: /certs/shop.crt}
                  private_key: {filename: /certs/shop.key}
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: https_shop
              route_config:
                name: shop
                virtual_hosts:
                - name: shop
                  domains: ["shop.lab", "shop.lab:10443"]
                  routes:
                  - match: {prefix: "/"}
                    route: {cluster: shop}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - filter_chain_match: {server_names: ["api.lab"]}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols: [h2, http/1.1]
                tls_certificates:
                - certificate_chain: {filename: /certs/api.crt}
                  private_key: {filename: /certs/api.key}
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: https_api
              route_config:
                name: api
                virtual_hosts:
                - name: api
                  domains: ["api.lab", "api.lab:10443"]
                  routes:
                  - match: {prefix: "/"}
                    route: {cluster: api}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: shop
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: shop
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: shop, port_value: 80}}}
      - name: api
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: api
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: api, port_value: 80}}}
