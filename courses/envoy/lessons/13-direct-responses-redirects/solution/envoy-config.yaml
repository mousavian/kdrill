apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: main
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: new
                  domains: ["new.lab"]
                  routes:
                  - match: {path: "/healthz"}
                    direct_response: {status: 200, body: {inline_string: "ok\n"}}
                  - match: {prefix: "/blog/"}
                    redirect:
                      prefix_rewrite: "/news/"
                      response_code: PERMANENT_REDIRECT     # 308: keeps the method
                  - match: {prefix: "/"}
                    route: {cluster: web}
                - name: old
                  domains: ["old.lab"]
                  routes:
                  - match: {path: "/healthz"}
                    direct_response: {status: 200, body: {inline_string: "ok\n"}}
                  - match: {prefix: "/"}
                    redirect:
                      scheme_redirect: https
                      host_redirect: new.lab
                      response_code: MOVED_PERMANENTLY      # 301; path and query are kept
                - name: unknown
                  domains: ["*"]
                  routes:
                  - match: {path: "/healthz"}
                    direct_response: {status: 200, body: {inline_string: "ok\n"}}
                  - match: {prefix: "/"}
                    direct_response: {status: 404, body: {inline_string: "no such site\n"}}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: web
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: web
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: web, port_value: 80}}}
