apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: main
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: shop
                  domains: ["shop.lab"]
                  routes:
                  - match: {prefix: "/"}
                    route: {cluster: shop}
                - name: catalog
                  domains: ["catalog.lab"]
                  routes:
                  - match: {prefix: "/"}
                    route: {cluster: catalog}
                - name: api
                  domains: ["api.lab"]
                  routes:
                  - match: {path: "/"}
                    route: {cluster: api}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: shop
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: shop
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: shop, port_value: 8080}}}
      - name: catalog
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: catalog
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: catalogue, port_value: 80}}}
      - name: api
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: api
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: api, port_value: 80}}}
