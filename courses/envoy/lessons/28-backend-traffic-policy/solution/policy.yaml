apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: cart-backend
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: cart
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Header
      header:
        name: x-user
  healthCheck:
    passive:                       # Envoy outlier detection (lesson 07)
      consecutive5XxErrors: 3
      interval: 2s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
