apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: main
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: all
                  domains: ["*"]
                  include_request_attempt_count: true   # upstream sees x-envoy-attempt-count
                  routes:
                  - match:                 # GET is idempotent: safe to repeat
                      prefix: "/"
                      headers:
                      - name: ":method"
                        string_match: {exact: GET}
                    route:
                      cluster: echo
                      retry_policy:
                        retry_on: "5xx,reset,connect-failure"
                        num_retries: 2
                        per_try_timeout: 1s
                        retry_host_predicate:
                        - name: envoy.retry_host_predicates.previous_hosts
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate
                        host_selection_retry_max_attempts: 3
                  - match: {prefix: "/"}   # everything else (POST, ...): no retries
                    route:
                      cluster: echo
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: echo
        type: STRICT_DNS             # headless Service: one host per pod
        connect_timeout: 1s
        dns_refresh_rate: 2s
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: echo
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: echo, port_value: 80}}}
