apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: main
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: all
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/reports"}
                    route: {cluster: reports}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: reports
        type: STRICT_DNS
        connect_timeout: 1s
        circuit_breakers:
          thresholds:
          - priority: DEFAULT
            max_connections: 4         # HTTP/1.1: one request per connection
            max_pending_requests: 2    # may wait for a free connection
            max_requests: 4            # concurrent requests (what counts for HTTP/2)
            max_retries: 1
        load_assignment:
          cluster_name: reports
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: reports, port_value: 80}}}
