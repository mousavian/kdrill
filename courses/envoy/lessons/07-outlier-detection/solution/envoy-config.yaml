apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: main
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: all
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/"}
                    route: {cluster: echo}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: echo
        type: STRICT_DNS             # headless Service: one host per pod
        connect_timeout: 1s
        dns_refresh_rate: 2s
        lb_policy: ROUND_ROBIN
        outlier_detection:
          consecutive_5xx: 3             # eject after 3 5xx in a row from one host
          interval: 5s                   # how often ejections are re-evaluated
          base_ejection_time: 30s        # first ejection 30 s, then 60 s, 90 s, ...
          max_ejection_percent: 50       # never eject more than half the hosts
        load_assignment:
          cluster_name: echo
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: echo, port_value: 80}}}
