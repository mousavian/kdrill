apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site
spec:
  parentRefs: [{name: edge}]
  hostnames: ["www.lab"]
  rules:
  - backendRefs: [{name: web, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
spec:
  parentRefs: [{name: edge}]
  hostnames: ["www.lab"]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /admin}
    backendRefs: [{name: admin, port: 80}]
