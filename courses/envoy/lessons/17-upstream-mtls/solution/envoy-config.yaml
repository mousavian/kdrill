apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: main
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: all
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/pay"}
                    route: {cluster: payments}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: payments
        type: STRICT_DNS
        connect_timeout: 1s
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            sni: payments.lab.svc.cluster.local
            common_tls_context:
              tls_certificates:               # who Envoy is (client certificate)
              - certificate_chain: {filename: /certs/client.crt}
                private_key: {filename: /certs/client.key}
              validation_context:             # whom Envoy trusts
                trusted_ca: {filename: /certs/ca.crt}
                match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: {exact: payments.lab.svc.cluster.local}
        load_assignment:
          cluster_name: payments
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: payments, port_value: 443}}}
