apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  # The bootstrap: who am I, where is the admin interface, where do my
  # listeners and clusters come from. Read once at start.
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    dynamic_resources:
      lds_config:
        resource_api_version: V3
        path_config_source:
          path: /etc/envoy/lds.yaml
          watched_directory: {path: /etc/envoy}   # kubelet swaps the ..data symlink on updates
      cds_config:
        resource_api_version: V3
        path_config_source:
          path: /etc/envoy/cds.yaml
          watched_directory: {path: /etc/envoy}
  # Listener discovery: a DiscoveryResponse, re-read whenever it changes.
  lds.yaml: |
    version_info: "2"
    resources:
    - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
      name: main
      address:
        socket_address: {address: 0.0.0.0, port_value: 10000}
      filter_chains:
      - filters:
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: ingress
            route_config:
              name: local_route
              virtual_hosts:
              - name: all
                domains: ["*"]
                routes:
                - match: {prefix: "/v2/"}
                  route: {cluster: echo-v2}
                - match: {prefix: "/"}
                  route: {cluster: echo-v1}
            http_filters:
            - name: envoy.filters.http.router
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  # Cluster discovery.
  cds.yaml: |
    version_info: "2"
    resources:
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: echo-v1
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: echo-v1
        endpoints:
        - lb_endpoints:
          - endpoint: {address: {socket_address: {address: echo-v1, port_value: 80}}}
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: echo-v2
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: echo-v2
        endpoints:
        - lb_endpoints:
          - endpoint: {address: {socket_address: {address: echo-v2, port_value: 80}}}
