apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: main
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: all
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/"}
                    route: {cluster: echo}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: echo
        type: STRICT_DNS             # headless Service: one host per pod
        connect_timeout: 1s
        dns_refresh_rate: 2s
        lb_policy: ROUND_ROBIN
        common_lb_config:
          healthy_panic_threshold: {value: 0}   # never route to unhealthy hosts
        health_checks:
        - timeout: 1s
          interval: 1s
          no_traffic_interval: 1s   # default 60s while the cluster has had no traffic
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /health           # the app's real health endpoint
        load_assignment:
          cluster_name: echo
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: echo, port_value: 80}}}
