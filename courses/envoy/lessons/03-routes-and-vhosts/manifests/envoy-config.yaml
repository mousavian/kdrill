apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: main
        address:
          socket_address: {address: 0.0.0.0, port_value: 10000}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress
              route_config:
                name: local_route
                virtual_hosts:
                - name: web
                  domains: ["www.lab"]
                  routes:
                  - match: {prefix: "/"}
                    route: {cluster: web}
                - name: api
                  domains: ["api.lab"]
                  routes:
                  - match: {prefix: "/"}
                    route: {cluster: api-v1}
                  - match: {prefix: "/v2"}
                    route: {cluster: api-v2}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: web
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: web
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: web, port_value: 80}}}
      - name: api-v1
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: api-v1
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: api-v1, port_value: 80}}}
      - name: api-v2
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: api-v2
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: api-v2, port_value: 80}}}
