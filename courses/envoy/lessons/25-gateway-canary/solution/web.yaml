apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs: [{name: edge}]
  hostnames: ["www.lab"]
  rules:
  - backendRefs:                    # everyone: 90/10 by weight
    - {name: web-v1, port: 80, weight: 90}
    - {name: web-v2, port: 80, weight: 10}
  - matches:                        # testers: always v2 (more specific match wins)
    - headers:
      - {name: x-canary, value: always}
    backendRefs:
    - {name: web-v2, port: 80}
