apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: site-a
spec:
  parentRefs: [{name: edge}]
  hostnames: ["a.lab"]
  rules:
  - backendRefs: [{name: site-a, port: 443}]
