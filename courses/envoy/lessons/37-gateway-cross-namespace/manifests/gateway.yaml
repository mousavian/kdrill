# Owned by the platform team: one shared entry point for every app team.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: infra
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "*.lab"
    # allowedRoutes is not set: only HTTPRoutes in namespace infra may attach.
