apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: infra
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "*.lab"
    allowedRoutes:
      namespaces:
        from: Selector              # Same (default) | All | Selector
        selector:
          matchLabels:
            gateway-access: public
