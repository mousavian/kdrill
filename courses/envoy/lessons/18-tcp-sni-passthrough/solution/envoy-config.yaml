apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: tls_passthrough
        address:
          socket_address: {address: 0.0.0.0, port_value: 10443}
        listener_filters:
        - name: envoy.filters.listener.tls_inspector   # read SNI, don't decrypt
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
        filter_chains:
        - filter_chain_match: {server_names: ["a.lab"]}
          filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: site_a
              cluster: site-a
        - filter_chain_match: {server_names: ["b.lab"]}
          filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: site_b
              cluster: site-b
      clusters:
      - name: site-a
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: site-a
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: site-a, port_value: 443}}}
      - name: site-b
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: site-b
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: site-b, port_value: 443}}}
