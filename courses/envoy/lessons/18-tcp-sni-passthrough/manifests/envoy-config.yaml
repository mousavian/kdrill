apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 0.0.0.0, port_value: 9901}
    static_resources:
      listeners:
      - name: tls_passthrough
        address:
          socket_address: {address: 0.0.0.0, port_value: 10443}
        filter_chains:
        - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: tls_passthrough
              cluster: site-a
      clusters:
      - name: site-a
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: site-a
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: site-a, port_value: 443}}}
      - name: site-b
        type: STRICT_DNS
        connect_timeout: 1s
        load_assignment:
          cluster_name: site-b
          endpoints:
          - lb_endpoints:
            - endpoint: {address: {socket_address: {address: site-b, port_value: 443}}}
