apiVersion: apps/v1
kind: Deployment
metadata:
  name: pretrain
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: pretrain}
  template:
    metadata:
      labels: {app: pretrain}
    spec:
      containers:
      - name: trainer
        image: nvcr.io/nvidia/pytorch:25.01-py3
        command: ["torchrun", "--nproc-per-node=8", "pretrain.py"]
        resources:
          requests: {cpu: "64", memory: 1Ti}
          limits:
            nvidia.com/gpu: 8
