# The two training jobs as originally submitted (no queue).
apiVersion: batch/v1
kind: Job
metadata:
  name: llama-ft
  namespace: training
spec:
  completionMode: Indexed       # worker i gets JOB_COMPLETION_INDEX=i (its rank)
  parallelism: 4                # all 4 workers must run at the same time
  completions: 4
  backoffLimit: 0
  template:
    metadata:
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: "6h"   # simulation only: how long the fake run lasts
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: nvcr.io/nvidia/pytorch:25.01-py3
        command: ["torchrun", "--nnodes=4", "--node-rank=$(JOB_COMPLETION_INDEX)", "--nproc-per-node=1", "llama_ft.py"]
        resources:
          requests: {cpu: "8", memory: 64Gi}
          limits:
            nvidia.com/gpu: 1
