apiVersion: apps/v1
kind: Deployment
metadata:
  name: pretrain
spec:
  replicas: 4
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: pretrain}
  template:
    metadata:
      labels: {app: pretrain}
    spec:
      priorityClassName: training-low
      containers:
      - name: trainer
        image: nvcr.io/nvidia/pytorch:25.01-py3
        command: ["torchrun", "--nproc-per-node=4", "pretrain.py", "--resume-from-checkpoint"]
        resources:
          requests: {cpu: "32", memory: 256Gi}
          limits:
            nvidia.com/gpu: 4
