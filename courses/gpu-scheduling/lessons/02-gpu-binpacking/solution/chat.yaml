apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
spec:
  replicas: 6
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: chat}
  template:
    metadata:
      labels: {app: chat}
    spec:
      schedulerName: gpu-binpack     # the bin-packing profile
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.11.0
        args: ["--model", "Qwen/Qwen2.5-7B-Instruct"]
        resources:
          requests: {cpu: "4", memory: 32Gi}
          limits:
            nvidia.com/gpu: 1
