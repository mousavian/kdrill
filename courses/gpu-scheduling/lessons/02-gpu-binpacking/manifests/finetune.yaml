apiVersion: apps/v1
kind: Deployment
metadata:
  name: finetune
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: finetune}
  template:
    metadata:
      labels: {app: finetune}
    spec:
      containers:
      - name: trainer
        image: nvcr.io/nvidia/pytorch:25.01-py3
        command: ["torchrun", "--nproc-per-node=4", "finetune.py"]
        resources:
          requests: {cpu: "16", memory: 128Gi}
          limits:
            nvidia.com/gpu: 4
