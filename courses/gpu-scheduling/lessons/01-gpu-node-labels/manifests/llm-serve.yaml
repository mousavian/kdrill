apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-serve
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: llm-serve}
  template:
    metadata:
      labels: {app: llm-serve}
    spec:
      nodeSelector:
        nvidia.com/gpu.product: H100      # <- does any node carry this value?
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.11.0
        args: ["--model", "meta-llama/Llama-3.3-70B-Instruct", "--tensor-parallel-size", "4"]
        resources:
          requests: {cpu: "16", memory: 128Gi}
          limits:
            nvidia.com/gpu: 4
