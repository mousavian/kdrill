apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl
spec:
  replicas: 3
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: etl}
  template:
    metadata:
      labels: {app: etl}
    spec:
      containers:
      - name: etl
        image: python:3.12-slim
        command: ["python", "-m", "etl"]
        resources:
          requests: {cpu: "4", memory: 8Gi}
