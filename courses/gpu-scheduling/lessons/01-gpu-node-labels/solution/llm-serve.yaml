apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-serve
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: llm-serve}
  template:
    metadata:
      labels: {app: llm-serve}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.memory     # MiB; 80 GB H100 = 81559, 48 GB L40S = 46068
                operator: Gt
                values: ["70000"]
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.11.0
        args: ["--model", "meta-llama/Llama-3.3-70B-Instruct", "--tensor-parallel-size", "4"]
        resources:
          requests: {cpu: "16", memory: 128Gi}
          limits:
            nvidia.com/gpu: 4
