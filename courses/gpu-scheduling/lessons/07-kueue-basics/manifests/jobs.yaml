apiVersion: batch/v1
kind: Job
metadata:
  name: train-1
  namespace: ml-team
  labels:
    kueue.x-k8s.io/queue-name: ml-team     # submit to the LocalQueue "ml-team"
spec:
  parallelism: 2
  completions: 2
  template:
    metadata:
      annotations:
        pod-complete.stage.kwok.x-k8s.io/delay: "6h"   # simulation only: how long the fake run lasts
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: nvcr.io/nvidia/pytorch:25.01-py3
        command: ["torchrun", "--nproc-per-node=2", "train.py"]
        resources:
          requests: {cpu: "8", memory: 64Gi}
          limits:
            nvidia.com/gpu: 2
---
