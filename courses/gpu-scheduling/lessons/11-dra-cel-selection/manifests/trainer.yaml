apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: trainer}
  template:
    metadata:
      labels: {app: trainer}
    spec:
      resourceClaims:
      - name: gpu
        resourceClaimTemplateName: two-h100
      containers:
      - name: trainer
        image: nvcr.io/nvidia/pytorch:25.01-py3
        resources:
          requests: {cpu: "4", memory: 32Gi}
          claims:
          - name: gpu
