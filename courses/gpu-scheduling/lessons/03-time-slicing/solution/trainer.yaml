apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: trainer}
  template:
    metadata:
      labels: {app: trainer}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.sharing-strategy
                operator: In
                values: [none]         # whole, unshared GPUs only (no time-slicing, no MPS)
      containers:
      - name: trainer
        image: nvcr.io/nvidia/pytorch:25.01-py3
        command: ["torchrun", "--nproc-per-node=4", "train.py"]
        resources:
          requests: {cpu: "8", memory: 64Gi}
          limits:
            nvidia.com/gpu: 4
