apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ddp-a
  labels:
    kueue.x-k8s.io/queue-name: training   # on the JobSet: Kueue admits the whole set as one Workload
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - name: workers
    replicas: 1
    template:
      spec:
        completionMode: Indexed
        completions: 2
        parallelism: 2
        backoffLimit: 0
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: train
              image: kdrill.local/ml-tiny:0.1.0
              command: [train]
              args: [--seed, "1", --log-every, "50"]
              env:
              - {name: WORLD_SIZE, value: "2"}
              - {name: MASTER_ADDR, value: ddp-a-workers-0-0.ddp-a}
              - {name: MASTER_PORT, value: "29500"}
              - {name: DIST_TIMEOUT, value: "300"}
              - {name: STEPS, value: "600"}
              - {name: BATCH_SIZE, value: "16"}
              - {name: LR, value: "0.001"}
              - {name: OMP_NUM_THREADS, value: "1"}
              resources:
                requests: {cpu: 750m, memory: 450Mi}
                limits: {cpu: "1", memory: 768Mi}
---
