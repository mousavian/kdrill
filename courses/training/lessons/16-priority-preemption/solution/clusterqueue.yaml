apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: training-cq
spec:
  namespaceSelector: {}
  preemption:
    withinClusterQueue: LowerPriority   # a pending workload may evict lower-priority admitted ones
  resourceGroups:
  - coveredResources: [cpu, memory]
    flavors:
    - name: default-flavor
      resources:
      - {name: cpu, nominalQuota: 1500m}
      - {name: memory, nominalQuota: 2Gi}
