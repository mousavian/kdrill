apiVersion: v1
kind: Service
metadata:
  name: workers
spec:
  clusterIP: None                 # headless: DNS returns the pods, no virtual IP
  publishNotReadyAddresses: true  # resolve pods before they are Ready (rendezvous happens at start)
  selector:
    batch.kubernetes.io/job-name: ddp
  ports:
  - {name: rendezvous, port: 29500}
