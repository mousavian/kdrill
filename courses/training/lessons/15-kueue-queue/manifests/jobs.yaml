apiVersion: batch/v1
kind: Job
metadata:
  name: exp-a
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: kdrill.local/ml-tiny:0.1.0
        command: [train]
        args: [--seed, "1", --log-every, "50"]
        env:
        - {name: STEPS, value: "500"}
        - {name: LR, value: "0.001"}
        - {name: OMP_NUM_THREADS, value: "1"}
        resources:
          requests: {cpu: "1", memory: 512Mi}
          limits: {cpu: "1", memory: 768Mi}
---
