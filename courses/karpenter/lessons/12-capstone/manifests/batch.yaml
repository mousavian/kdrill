# crunch: interruptible batch work; spot preferred, on-demand acceptable
apiVersion: apps/v1
kind: Deployment
metadata: {name: crunch, namespace: batch}
spec:
  replicas: 6
  selector: {matchLabels: {app: crunch}}
  template:
    metadata: {labels: {app: crunch}}
    spec:
      nodeSelector:
        karpenter.sh/capacity-type: spot
      tolerations:
      - {key: spot, operator: Exists, effect: NoSchedule}
      containers:
      - name: crunch
        image: ghcr.io/example/crunch:3.0
        resources:
          requests: {cpu: "2", memory: 4Gi}
