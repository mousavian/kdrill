# checkout: copied from the us-east-1 cluster's manifests
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: prod}
spec:
  replicas: 3
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout}}
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: us-east-1a
      containers:
      - name: checkout
        image: ghcr.io/example/checkout:5.1
        resources:
          requests: {cpu: "1", memory: 2Gi}
---
# legacy: protected during last quarter's data migration
apiVersion: apps/v1
kind: Deployment
metadata: {name: legacy, namespace: prod}
spec:
  replicas: 1
  selector: {matchLabels: {app: legacy}}
  template:
    metadata:
      labels: {app: legacy}
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      containers:
      - name: legacy
        image: ghcr.io/example/legacy-billing:1.0
        resources:
          requests: {cpu: "1", memory: 2Gi}
