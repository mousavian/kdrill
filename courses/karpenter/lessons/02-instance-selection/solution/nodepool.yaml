apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    spec:
      nodeClassRef: {group: karpenter.kwok.sh, kind: KWOKNodeClass, name: default}
      requirements:
      - key: kubernetes.io/arch                   # Graviton
        operator: In
        values: [arm64]
      - key: karpenter.k8s.aws/instance-category  # general purpose: m*
        operator: In
        values: [m]
      - key: karpenter.kwok.sh/instance-cpu       # xlarge or bigger (> 3 vCPUs)
        operator: Gt
        values: ["3"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: [on-demand]
  limits:
    cpu: "64"
