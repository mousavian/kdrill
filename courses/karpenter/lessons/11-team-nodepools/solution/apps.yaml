apiVersion: apps/v1
kind: Deployment
metadata: {name: etl, namespace: team-a}
spec:
  replicas: 4
  selector: {matchLabels: {app: etl}}
  template:
    metadata: {labels: {app: etl}}
    spec:
      nodeSelector: {team: team-a}
      tolerations:
      - {key: team, operator: Equal, value: team-a, effect: NoSchedule}
      containers:
      - name: etl
        image: ghcr.io/team-a/etl:7.1
        resources:
          requests: {cpu: "1", memory: 4Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: team-b}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      nodeSelector: {team: team-b}
      tolerations:
      - {key: team, operator: Equal, value: team-b, effect: NoSchedule}
      containers:
      - name: web
        image: ghcr.io/team-b/web:2.3
        resources:
          requests: {cpu: "1", memory: 2Gi}
