# Someone's experiment. Nobody approved GPU spend in this pool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-batch
  namespace: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: ml-batch}
  template:
    metadata:
      labels: {app: ml-batch}
    spec:
      containers:
      - name: train
        image: nvcr.io/nvidia/pytorch:25.01-py3
        resources:
          requests: {cpu: "2", memory: 8Gi}
          limits: {nvidia.com/gpu: 1}
