apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: ml
spec:
  replicas: 2
  selector:
    matchLabels: {app: inference}
  template:
    metadata:
      labels: {app: inference}
    spec:
      tolerations:                  # allowed onto the tainted GPU nodes
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.11.0
        args: ["--model", "Qwen/Qwen2.5-7B-Instruct"]
        resources:
          requests: {cpu: "2", memory: 12Gi}
          limits: {nvidia.com/gpu: 1}
