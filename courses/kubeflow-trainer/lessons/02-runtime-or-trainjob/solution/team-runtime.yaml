apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainingRuntime                 # namespaced: only TrainJobs of this namespace can use it
metadata:
  name: team-tiny
  labels:
    trainer.kubeflow.org/framework: torch
spec:
  mlPolicy:
    numNodes: 1
    torch: {}
  template:
    spec:
      replicatedJobs:
      - name: node
        template:
          metadata:
            labels:
              trainer.kubeflow.org/trainjob-ancestor-step: trainer
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                - name: node
                  image: kdrill.local/ml-tiny:0.1.0
                  command: [train]
                  args: [--steps, "150", --seed, "7", --log-every, "50"]    # the team's defaults
                  env:
                  - {name: OMP_NUM_THREADS, value: "1"}
                  resources:
                    requests: {cpu: 250m, memory: 450Mi}
                    limits: {memory: 768Mi}
