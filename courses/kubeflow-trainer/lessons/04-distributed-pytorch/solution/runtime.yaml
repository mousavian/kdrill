# The platform's runtime for multi-node training, fixed: the PyTorch policy and torchrun.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: tiny-ddp
  labels:
    trainer.kubeflow.org/framework: torch
spec:
  mlPolicy:
    numNodes: 1
    torch: {}                    # the PyTorch policy: the controller injects PET_NNODES, PET_NODE_RANK, ...
  template:
    spec:
      replicatedJobs:
      - name: node
        template:
          metadata:
            labels:
              trainer.kubeflow.org/trainjob-ancestor-step: trainer
          spec:
            backoffLimit: 0
            template:
              spec:
                terminationGracePeriodSeconds: 3     # lab: old pods must not linger (same names, same DNS records)
                restartPolicy: Never
                containers:
                - name: node
                  image: kdrill.local/ml-tiny:0.1.0
                  command: [torchrun, /opt/ml-tiny/app/train.py]   # torchrun reads the PET_* variables
                  env:
                  - {name: OMP_NUM_THREADS, value: "1"}
                  resources:
                    requests: {cpu: 250m, memory: 450Mi}
                    limits: {memory: 768Mi}
