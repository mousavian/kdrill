apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: llama
  labels:
    kueue.x-k8s.io/queue-name: training     # admitted as a unit by Kueue
spec:
  runtimeRef:
    name: gpu-ddp
  trainer:
    numNodes: 2
    args: [--steps, "1000"]
