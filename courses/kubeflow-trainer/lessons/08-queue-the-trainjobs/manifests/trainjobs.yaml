apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: exp-a
spec:
  runtimeRef:
    name: tiny-ddp
  trainer:
    numNodes: 2
    args: [--steps, "400", --seed, "1", --batch-size, "16", --log-every, "100"]
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: exp-b
spec:
  runtimeRef:
    name: tiny-ddp
  trainer:
    numNodes: 2
    args: [--steps, "400", --seed, "2", --batch-size, "16", --log-every, "100"]
