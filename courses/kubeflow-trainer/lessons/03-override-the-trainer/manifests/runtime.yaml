# The platform's runtime. Its default run is long (1200 steps).
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: tiny-gpt
  labels:
    trainer.kubeflow.org/framework: torch
spec:
  mlPolicy:
    numNodes: 1
    torch: {}
  template:
    spec:
      replicatedJobs:
      - name: node
        template:
          metadata:
            labels:
              trainer.kubeflow.org/trainjob-ancestor-step: trainer
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                - name: node
                  image: kdrill.local/ml-tiny:0.1.0
                  command: [train]
                  args: [--steps, "1200", --seed, "1", --log-every, "100"]
                  env:
                  - {name: OMP_NUM_THREADS, value: "1"}
                  resources:
                    requests: {cpu: 250m, memory: 450Mi}
                    limits: {memory: 768Mi}
