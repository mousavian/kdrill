apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: flaky
spec:
  runtimeRef:
    name: tiny-resume
  trainer:
    env:
    - {name: STEPS, value: "800"}
    - {name: CKPT_EVERY, value: "50"}
    - {name: CKPT_DIR, value: /ckpt}           # where train writes checkpoints and resumes from
    - {name: FAIL_AT_STEP, value: "300"}     # planted: the process crashes here ...
    - {name: FAIL_ONCE, value: "true"}       # ... the first time only (remembered next to the checkpoints)
  runtimePatches:                            # the user's additions to the platform's runtime
  - manager: kdrill.dev/learner              # who owns this patch entry: a domain-prefixed name
    trainingRuntimeSpec:
      template:
        spec:
          replicatedJobs:
          - name: node
            template:
              spec:
                template:
                  spec:
                    volumes:
                    - name: ckpt
                      persistentVolumeClaim: {claimName: checkpoints}
                    containers:
                    - name: node
                      volumeMounts:
                      - {name: ckpt, mountPath: /ckpt}
