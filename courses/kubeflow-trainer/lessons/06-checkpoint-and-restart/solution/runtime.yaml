# The platform's runtime, fixed: a failed Job restarts the whole JobSet, at most 3 times.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: tiny-resume
  labels:
    trainer.kubeflow.org/framework: torch
spec:
  mlPolicy:
    numNodes: 1
    torch: {}
  template:
    spec:
      failurePolicy:
        maxRestarts: 3          # JobSet deletes and recreates all its Jobs when one fails, up to 3 times
      replicatedJobs:
      - name: node
        template:
          metadata:
            labels:
              trainer.kubeflow.org/trainjob-ancestor-step: trainer
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                - name: node
                  image: kdrill.local/ml-tiny:0.1.0
                  command: [train]
                  args: [--seed, "1", --log-every, "50"]
                  env:
                  - {name: OMP_NUM_THREADS, value: "1"}
                  resources:
                    requests: {cpu: 250m, memory: 450Mi}
                    limits: {memory: 768Mi}
