# The team's legacy manifest (Kubeflow Training Operator v1). The Training Operator is not installed
# in this lab: this file is for reading and translating; it cannot be applied here.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: tiny-pytorchjob
spec:
  runPolicy:
    cleanPodPolicy: None
    backoffLimit: 0
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
          - name: pytorch                      # the operator requires this container name
            image: kdrill.local/ml-tiny:0.1.0
            command: [train, --steps, "400", --seed, "5", --batch-size, "16", --log-every, "100"]
            env:
            - {name: RUN_NAME, value: legacy-migration}
            - {name: OMP_NUM_THREADS, value: "1"}
            resources:
              requests: {cpu: 500m, memory: 450Mi}
              limits: {memory: 1Gi}
    Worker:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
          - name: pytorch
            image: kdrill.local/ml-tiny:0.1.0
            command: [train, --steps, "400", --seed, "5", --batch-size, "16", --log-every, "100"]
            env:
            - {name: RUN_NAME, value: legacy-migration}
            - {name: OMP_NUM_THREADS, value: "1"}
            resources:
              requests: {cpu: 500m, memory: 450Mi}
              limits: {memory: 1Gi}
