apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
spec:
  parentRefs: [{name: edge}]
  rules:
  - backendRefs: [{name: pool, port: 80}]
    timeouts: {request: 60s}
---
# the endpoint picker is wired in as in lesson 15
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: epp
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm}
  extProc:
  - backendRefs: [{name: epp, port: 9002}]
    messageTimeout: 5s
    processingMode:
      request: {body: FullDuplexStreamed}
      response: {body: FullDuplexStreamed}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: pick
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm}
  loadBalancer:
    type: LeastRequest
    endpointOverride:
      extractFrom:
      - header: x-gateway-destination-endpoint
