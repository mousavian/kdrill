apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  labels: {app: llm}
spec:
  replicas: 2
  selector:
    matchLabels: {app: llm}
  template:
    metadata:
      labels: {app: llm, llm-d.ai/engine-type: vllm}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim@sha256:9992453829c0dea8d120b8e0322bb0e4237cbb3c6d9ea3bdce060410c40c91c9
        # --startup-duration: /health/ready answers 503 for this long, like a server loading weights.
        args: [--model, tiny, --port, "8000", --startup-duration, 15s, --time-to-first-token, 100ms, --inter-token-latency, 20ms]
        env:
        - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        ports:
        - {name: http, containerPort: 8000}
        livenessProbe:
          httpGet: {path: /health/ready, port: http}
          initialDelaySeconds: 3
          periodSeconds: 3
          failureThreshold: 2
        readinessProbe:
          tcpSocket: {port: http}
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 24Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: llm
spec:
  selector: {app: llm}
  ports:
  - {name: http, port: 80, targetPort: http}
