apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: per-key-limit
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: llm}
  rateLimit:
    type: Local
    local:
      rules:
      - clientSelectors:
        - headers:
          - {name: x-api-key, type: Distinct}
        limit: {requests: 2, unit: Second}
