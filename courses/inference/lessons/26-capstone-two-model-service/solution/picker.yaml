apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: chat-pick
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: chat}
  loadBalancer:
    type: LeastRequest
    endpointOverride:
      extractFrom:
      - header: x-gateway-destination-endpoint
