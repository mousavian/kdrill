apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
# One EnvoyExtensionPolicy for the Gateway (a target can have only one):
#  1. the model name is copied from the request body into x-model (as in lesson 13);
#  2. the endpoint picker is called for every request (as in lesson 15). It is attached to the Gateway, not to the chat
#     route, because the route is only chosen after the Lua filter has set x-model.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: edge-filters
spec:
  targetRefs:
  - {group: gateway.networking.k8s.io, kind: Gateway, name: edge}
  extProc:
  - backendRefs: [{name: epp, port: 9002}]
    messageTimeout: 5s
    processingMode:
      request: {body: FullDuplexStreamed}
      response: {body: FullDuplexStreamed}
  lua:
  - type: Inline
    inline: |
      function envoy_on_request(handle)
        local body = handle:body()
        if body ~= nil and body:length() > 0 then
          local s = body:getBytes(0, body:length())
          local m = string.match(s, '"model"%s*:%s*"([^"]+)"')
          if m ~= nil then
            handle:headers():replace("x-model", m)
            return
          end
        end
        handle:headers():remove("x-model")
      end
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: model-not-found
spec:
  directResponse:
    statusCode: 404
    contentType: application/json
    body: {type: Inline, inline: '{"error":{"message":"model not found"}}'}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat
spec:
  parentRefs: [{name: edge}]
  rules:
  - matches: [{headers: [{name: x-model, value: chat}]}]
    backendRefs: [{name: chat, port: 80}]
    timeouts: {request: 60s}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: summarize
spec:
  parentRefs: [{name: edge}]
  rules:
  - matches: [{headers: [{name: x-model, value: summarize}]}]
    backendRefs: [{name: summarise, port: 80}]
    timeouts: {request: 60s}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: other-models
spec:
  parentRefs: [{name: edge}]
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef: {group: gateway.envoyproxy.io, kind: HTTPRouteFilter, name: model-not-found}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: chat
spec:
  scaleTargetRef: {name: chat}
  minReplicaCount: 2
  maxReplicaCount: 3
  pollingInterval: 30
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown: {stabilizationWindowSeconds: 300}
  triggers:
  - type: metrics-api
    metadata:
      url: http://aggregator.lab.svc.cluster.local/
      valueLocation: running
      targetValue: "3"
      format: json
