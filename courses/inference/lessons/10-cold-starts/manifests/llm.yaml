apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  labels: {app: llm}
spec:
  replicas: 0
  selector:
    matchLabels: {app: llm}
  template:
    metadata:
      labels: {app: llm, llm-d.ai/engine-type: vllm}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim@sha256:9992453829c0dea8d120b8e0322bb0e4237cbb3c6d9ea3bdce060410c40c91c9
        imagePullPolicy: Always
        # --startup-duration is the model load: /health/ready answers 503 for 20 s.
        args: [--model, tiny, --mode, echo, --port, "8000", --max-num-seqs, "2", --startup-duration, 20s, --time-to-first-token, 100ms, --inter-token-latency, 20ms]
        env:
        - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        ports:
        - {name: http, containerPort: 8000}
        startupProbe:
          httpGet: {path: /health/ready, port: http}
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /health/ready, port: http}
          periodSeconds: 5
        resources:
          requests: {cpu: 10m, memory: 24Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: llm
spec:
  selector: {app: llm}
  ports:
  - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-pods
spec:
  clusterIP: None
  selector: {app: llm}
  ports: [{name: http, port: 8000}]
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: llm
spec:
  scaleTargetRef:
    name: llm
  minReplicaCount: 0
  maxReplicaCount: 3
  pollingInterval: 5
  cooldownPeriod: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown: {stabilizationWindowSeconds: 15}
  triggers:
  - type: metrics-api
    metadata:
      url: http://aggregator.lab.svc.cluster.local/
      valueLocation: inflight
      targetValue: "2"
      format: json
