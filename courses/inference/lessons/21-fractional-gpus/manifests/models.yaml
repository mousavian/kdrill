apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels: {app: chat}
spec:
  replicas: 2
  selector:
    matchLabels: {app: chat}
  template:
    metadata:
      labels: {app: chat}
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.11.0
        args: [--model, meta-llama/Llama-3.1-8B-Instruct]
        resources:
          requests: {cpu: "8", memory: 32Gi}
          limits: {nvidia.com/gpu: 1}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed
  labels: {app: embed}
spec:
  replicas: 6
  selector:
    matchLabels: {app: embed}
  template:
    metadata:
      labels: {app: embed}
      annotations:
        # BAAI/bge-m3 (568M parameters, 16-bit) plus runtime: needs about 9 GB of GPU memory
        kdrill.dev/model-gpu-memory: "9Gi"
    spec:
      containers:
      - name: server
        image: ghcr.io/huggingface/text-embeddings-inference:1.8
        args: [--model-id, BAAI/bge-m3]
        resources:
          requests: {cpu: "2", memory: 8Gi}
          limits: {nvidia.com/gpu: 1}
