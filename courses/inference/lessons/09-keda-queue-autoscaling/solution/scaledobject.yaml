apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: llm
spec:
  scaleTargetRef:
    name: llm
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 15
  triggers:
  - type: metrics-api
    metadata:
      url: http://aggregator.lab.svc.cluster.local/
      valueLocation: inflight
      targetValue: "2"
      format: json
