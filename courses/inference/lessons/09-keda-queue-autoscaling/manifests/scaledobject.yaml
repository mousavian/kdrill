apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: llm
spec:
  scaleTargetRef:
    name: llm
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 30
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
  - type: metrics-api
    metadata:
      url: http://aggregator.lab.svc.cluster.local/
      valueLocation: running
      targetValue: "2"
      format: json
