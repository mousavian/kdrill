apiVersion: batch/v1
kind: Job
metadata:
  name: urgent-eval
  labels:
    kueue.x-k8s.io/queue-name: training
    kueue.x-k8s.io/priority-class: urgent   # WorkloadPriorityClass value 1000 > pretrain's 100
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: kdrill.local/ml-tiny:0.1.0
        command: [train]
        args: [--seed, "2", --log-every, "50"]
        env:
        - {name: STEPS, value: "200"}
        - {name: OMP_NUM_THREADS, value: "1"}
        resources:
          requests: {cpu: "1", memory: 512Mi}
          limits: {cpu: "1", memory: 768Mi}
