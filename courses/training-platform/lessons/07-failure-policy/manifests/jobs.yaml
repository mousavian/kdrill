# buggy: the training code crashes at step 50 every time (exit code 42).
# steady: a healthy run that verify will evict once, like a node drain would.
apiVersion: batch/v1
kind: Job
metadata:
  name: buggy
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: kdrill.local/ml-tiny:0.1.0
        command: [train]
        args: [--seed, "1", --log-every, "25"]
        env:
        - {name: STEPS, value: "300"}
        - {name: FAIL_AT_STEP, value: "50"}     # simulates the bug: exit 42 at step 50
        - {name: OMP_NUM_THREADS, value: "1"}
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "1", memory: 768Mi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: steady
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: kdrill.local/ml-tiny:0.1.0
        command: [train]
        args: [--seed, "1", --log-every, "25"]
        env:
        - {name: STEPS, value: "500"}
        - {name: OMP_NUM_THREADS, value: "1"}
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "1", memory: 768Mi}
