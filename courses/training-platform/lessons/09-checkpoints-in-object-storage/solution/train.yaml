apiVersion: batch/v1
kind: Job
metadata:
  name: train
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: kdrill.local/ml-tiny:0.1.0
        command: [train]
        args: [--seed, "1", --log-every, "50"]
        env:
        - {name: STEPS, value: "600"}
        - {name: CKPT_DIR, value: "s3://checkpoints/shakespeare"}
        - {name: CKPT_EVERY, value: "100"}
        - {name: AWS_ENDPOINT_URL, value: "http://minio:9000"}   # MinIO, not AWS
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}
        - {name: OMP_NUM_THREADS, value: "2"}
        resources:
          requests: {cpu: "1", memory: 512Mi}
          limits: {cpu: "2", memory: 768Mi}
