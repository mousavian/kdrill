apiVersion: batch/v1
kind: Job
metadata:
  name: sample
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: sample
        image: kdrill.local/ml-tiny:0.1.0
        command: [sample, --model, /models/capstone, --chars, "300"]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 512Mi}
        volumeMounts:
        - {name: models, mountPath: /models, readOnly: true}
      volumes:
      - name: models
        persistentVolumeClaim: {claimName: models}
