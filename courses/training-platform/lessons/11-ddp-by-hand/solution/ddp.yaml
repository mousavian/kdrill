apiVersion: batch/v1
kind: Job
metadata:
  name: ddp
spec:
  completionMode: Indexed   # pod i -> JOB_COMPLETION_INDEX=i = its rank
  completions: 2
  parallelism: 2            # both workers must run at the same time
  backoffLimit: 2
  template:
    metadata:
      labels: {app: ddp}
    spec:
      restartPolicy: Never
      subdomain: workers      # = the headless Service: pods get <hostname>.workers DNS names
      containers:
      - name: train
        image: kdrill.local/ml-tiny:0.1.0
        command: [train]
        args: [--seed, "1", --log-every, "50"]
        env:
        - {name: WORLD_SIZE, value: "2"}
        - {name: MASTER_ADDR, value: ddp-0.workers}     # rank 0's pod
        - {name: MASTER_PORT, value: "29500"}
        - {name: DIST_TIMEOUT, value: "180"}
        - {name: STEPS, value: "300"}
        - {name: BATCH_SIZE, value: "16"}               # per worker: 2 x 16 = 32 per step
        - {name: OUT_DIR, value: /results}
        - {name: OMP_NUM_THREADS, value: "1"}
        ports:
        - {name: rendezvous, containerPort: 29500}
        resources:
          requests: {cpu: 250m, memory: 450Mi}
          limits: {cpu: "1", memory: 768Mi}
        volumeMounts:
        - {name: results, mountPath: /results}
      volumes:
      - name: results
        persistentVolumeClaim: {claimName: results}
