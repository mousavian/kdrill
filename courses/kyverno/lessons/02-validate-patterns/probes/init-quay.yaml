apiVersion: v1
kind: Pod
metadata:
  name: probe-init-quay
  namespace: ml-serving
spec:
  initContainers:
  - name: init
    image: quay.io/tools/init:2.0
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {memory: 64Mi}
  containers:
  - name: main
    image: registry.acme.io/ml/ranker:3.2.1
    resources:
      requests: {cpu: 100m, memory: 64Mi}
      limits: {memory: 64Mi}
