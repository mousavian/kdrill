# Compliant with what the policies are supposed to require.
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: payments}
spec:
  replicas: 2
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout, owner: team-payments}}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
      - {name: checkout, image: registry.acme.io/payments/checkout:5.2.0, resources: {requests: {cpu: 500m, memory: 512Mi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fraud-model, namespace: payments}
spec:
  replicas: 1
  selector: {matchLabels: {app: fraud-model}}
  template:
    metadata: {labels: {app: fraud-model, owner: team-risk}}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
      - name: model
        image: registry.acme.io/risk/fraud-model:1.8.0
        resources:
          requests: {cpu: "4", memory: 16Gi}
          limits: {nvidia.com/gpu: 1}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reports, namespace: analytics}
spec:
  replicas: 1
  selector: {matchLabels: {app: reports}}
  template:
    metadata: {labels: {app: reports, owner: team-data}}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
      - {name: reports, image: registry.acme.io/data/reports:2.4.1, resources: {requests: {cpu: 250m, memory: 256Mi}}}
---
# playground (env=dev): anything goes.
apiVersion: apps/v1
kind: Deployment
metadata: {name: scratch, namespace: playground}
spec:
  replicas: 1
  selector: {matchLabels: {app: scratch}}
  template:
    metadata: {labels: {app: scratch}}
    spec:
      containers:
      - {name: shell, image: busybox:1.37, resources: {requests: {cpu: 100m, memory: 64Mi}}}
