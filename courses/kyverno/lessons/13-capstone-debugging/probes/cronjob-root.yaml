apiVersion: batch/v1
kind: CronJob
metadata: {name: probe-nightly}
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        metadata: {labels: {owner: team-payments}}
        spec:
          restartPolicy: OnFailure
          containers:
          - {name: c, image: registry.acme.io/payments/reconcile:1.0.0}
