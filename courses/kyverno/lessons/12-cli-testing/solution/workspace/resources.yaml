apiVersion: v1
kind: Pod
metadata: {name: gpu-pod-ok, namespace: ml}
spec:
  nodeSelector: {nvidia.com/gpu.product: NVIDIA-L4}
  containers:
  - name: model
    image: vllm/vllm-openai:v0.11.0
    resources: {limits: {nvidia.com/gpu: 1}}
---
apiVersion: v1
kind: Pod
metadata: {name: gpu-pod-missing, namespace: ml}
spec:
  containers:
  - name: model
    image: vllm/vllm-openai:v0.11.0
    resources: {limits: {nvidia.com/gpu: 1}}
---
apiVersion: v1
kind: Pod
metadata: {name: cpu-pod, namespace: ml}
spec:
  containers:
  - {name: web, image: nginx:1.27}
---
# The GPU is requested by the second container: the case the old
# precondition (containers[0] only) missed.
apiVersion: v1
kind: Pod
metadata: {name: gpu-sidecar-missing, namespace: ml}
spec:
  containers:
  - {name: proxy, image: envoyproxy/envoy:v1.34.0}
  - name: model
    image: vllm/vllm-openai:v0.11.0
    resources: {limits: {nvidia.com/gpu: 1}}
