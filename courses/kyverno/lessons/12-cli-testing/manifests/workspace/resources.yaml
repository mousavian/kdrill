apiVersion: v1
kind: Pod
metadata: {name: gpu-pod-ok, namespace: ml}
spec:
  nodeSelector: {nvidia.com/gpu.product: NVIDIA-L4}
  containers:
  - name: model
    image: vllm/vllm-openai:v0.11.0
    resources: {limits: {nvidia.com/gpu: 1}}
---
apiVersion: v1
kind: Pod
metadata: {name: gpu-pod-missing, namespace: ml}
spec:
  containers:
  - name: model
    image: vllm/vllm-openai:v0.11.0
    resources: {limits: {nvidia.com/gpu: 1}}
---
apiVersion: v1
kind: Pod
metadata: {name: cpu-pod, namespace: ml}
spec:
  containers:
  - {name: web, image: nginx:1.27}
