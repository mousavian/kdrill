# Chat model on any L4 GPU.
apiVersion: apps/v1
kind: Deployment
metadata: {name: chat, namespace: ml-team}
spec:
  replicas: 2
  selector: {matchLabels: {app: chat}}
  template:
    metadata: {labels: {app: chat}}
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.11.0
        resources:
          requests: {cpu: "4", memory: 16Gi}
          limits: {nvidia.com/gpu: 1}
---
# Fine-tuning on the dedicated H100 node.
apiVersion: apps/v1
kind: Deployment
metadata: {name: trainer, namespace: ml-team}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: trainer}}
  template:
    metadata: {labels: {app: trainer}}
    spec:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
      tolerations:
      - {key: dedicated, operator: Equal, value: training, effect: NoSchedule}
      containers:
      - name: trainer
        image: nvcr.io/nvidia/pytorch:25.01-py3
        resources:
          requests: {cpu: "32", memory: 256Gi}
          limits: {nvidia.com/gpu: 8}
---
# Plain web front end: no GPU, belongs on the CPU workers.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: ml-team}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: nginx:1.27
        resources:
          requests: {cpu: 500m, memory: 512Mi}
