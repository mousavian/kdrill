# The GPU is requested by the second container, not the first.
apiVersion: v1
kind: Pod
metadata: {name: probe-gpu-sidecar, namespace: ml-team}
spec:
  containers:
  - {name: proxy, image: envoyproxy/envoy:v1.34.0}
  - name: model
    image: vllm/vllm-openai:v0.11.0
    resources:
      limits: {nvidia.com/gpu: 1}
