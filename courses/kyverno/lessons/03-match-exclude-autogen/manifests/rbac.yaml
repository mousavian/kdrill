# Two ServiceAccounts that may create workloads in prod.
apiVersion: v1
kind: ServiceAccount
metadata: {name: backup-agent, namespace: prod}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: deployer, namespace: prod}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: workload-editors, namespace: prod}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
subjects:
- {kind: ServiceAccount, name: backup-agent, namespace: prod}
- {kind: ServiceAccount, name: deployer, namespace: prod}
