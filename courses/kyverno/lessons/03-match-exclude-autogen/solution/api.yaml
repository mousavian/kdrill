apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      securityContext:
        runAsNonRoot: true        # what the policy requires
      containers:
      - name: api
        image: registry.acme.io/shop/api:2.8.0
        resources:
          requests: {cpu: 250m, memory: 256Mi}
