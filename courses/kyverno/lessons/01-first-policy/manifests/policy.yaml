# Written by the platform team last quarter: "every Pod belongs to a team".
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-team-label
spec:
  background: true
  rules:
  - name: check-team
    match:
      any:
      - resources:
          kinds: [Pod]
    validate:
      failureAction: Audit
      message: "invalid pod"
      pattern:
        metadata:
          labels:
            team: "*"
