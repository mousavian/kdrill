apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-baseline
spec:
  background: true
  rules:
  - name: disallow-host-path
    match:
      any:
      - resources:
          kinds: [Pod]
    validate:
      failureAction: Enforce
      message: "hostPath volumes are not allowed"
      pattern:
        spec:
          =(volumes):
          - X(hostPath): "null"          # negation anchor: the key must not exist
  - name: disallow-privileged
    match:
      any:
      - resources:
          kinds: [Pod]
    validate:
      failureAction: Enforce
      message: "privileged containers are not allowed"
      pattern:
        spec:
          containers:
          - =(securityContext):
              =(privileged): "false"
