# NVIDIA DCGM exporter: GPU metrics for Prometheus. It reads the kubelet's
# pod-resources socket to map GPUs to Pods, hence the hostPath volume.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: gpu-operator
spec:
  selector:
    matchLabels: {app: dcgm-exporter}
  template:
    metadata:
      labels: {app: dcgm-exporter}
    spec:
      containers:
      - name: exporter
        image: nvcr.io/nvidia/k8s/dcgm-exporter:4.2.3-4.1.3-ubuntu22.04
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 256Mi}
        volumeMounts:
        - {name: pod-resources, mountPath: /var/lib/kubelet/pod-resources, readOnly: true}
      volumes:
      - name: pod-resources
        hostPath: {path: /var/lib/kubelet/pod-resources}
