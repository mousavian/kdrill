# Some other Pod with a hostPath volume.
apiVersion: v1
kind: Pod
metadata:
  name: node-debugger
  labels: {app: node-debugger}
spec:
  containers:
  - name: c
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.2.3-4.1.3-ubuntu22.04
    volumeMounts:
    - {name: pod-resources, mountPath: /var/lib/kubelet/pod-resources}
  volumes:
  - name: pod-resources
    hostPath: {path: /var/lib/kubelet/pod-resources}
