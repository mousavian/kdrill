# A dcgm-exporter Pod that is also privileged.
apiVersion: v1
kind: Pod
metadata:
  name: dcgm-exporter-probe2
  labels: {app: dcgm-exporter}
spec:
  containers:
  - name: c
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.2.3-4.1.3-ubuntu22.04
    securityContext: {privileged: true}
    volumeMounts:
    - {name: pod-resources, mountPath: /var/lib/kubelet/pod-resources}
  volumes:
  - name: pod-resources
    hostPath: {path: /var/lib/kubelet/pod-resources}
