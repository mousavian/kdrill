# Publishes site/ to GitHub Pages at kdrill.5xx.tech.
# Works once kdrill is its own repository (this folder at the repo root).
# Repo settings: Pages > Source: GitHub Actions; custom domain kdrill.5xx.tech.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the public files (notes/ stays out)
        run: |
          mkdir _site
          cp site/index.html site/404.html site/og.png site/CNAME _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
